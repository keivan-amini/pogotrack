# === GLOBAL DEBUGGING ===
DEBUG_MODE: false     # If true, debug plotting helpers (e.g., frame visualizations) will run. If false, they no-op.
PLOT_TRAJECTORIES: false    # If True, plot_trajectories() will run after tracking

# === VIDEO PROCESSING PARAMETERS ===
N_POGO: 64
THRESHOLD: 50          # Binarization threshold for foreground segmentation.
AREAS: [1000, 10000]    # [MIN, MAX] contour area in pixels^2 used to accept detected blobs.
PERIMETERS: [100, 900] # [MIN, MAX] contour perimeter in pixels used to accept detected blobs.
CENTER: [1512, 1450]   # Arena center in pixels (X, Y).
RADIUS: 1380    #1380       # Arena radius in pixels for the circular mask.
SEARCH_RANGE: 200      # Trackpy search range (in pixels) to link detections across frames. it was 180 for t_5 analysis
MEMORY: 5              # Max frames number during which a pogobot can disappear, then reappear nearby, and be considered the same particle.

RECT_MASK: false       # Change circular masking to rectangular masking
WIDTH: 0               # Recutangular mask width (requires RECT_MASK)
HEIGHT: 0              # Recutangular mask heigth (requires RECT_MASK)
MAX_OFFSET: 50          # Maximum threshold offset applied to frame.
FALLBACK_AREA: [1000, 10000] # Fallback area params
FALLBACK_PERIMETERS: [100, 900] # Fallback perimeters params

# === UNITS CONVERSION / TIMING ===
FPS: 20             # Frames-per-second to convert frame index → time in seconds.
POGOBOT_DIAMETER_CM: 4.975  # Pogobot physical diameter in centimeters.
PIXEL_DIAMETER: 97.01       # Pogobot apparent diameter in pixels (calibration).

# === RGB-ID ANALYSIS === #

RGB_ID_ANALYSIS: False

RGB_ID:
  ROI_SIZE: 30
  GAMMA: 80
  RHO: 20
  DETECT_ON_FRAME: 0

  # Region labels are used by optional RGB debug images.
  REGION_TEST_ON_UNFLIPPED_COORDS: true

  DEBUG_RGB: true
  DEBUG_RGB_DIR: "rgb_id_debug"
  DEBUG_RGB_FRAMES: []
  DEBUG_RGB_EVERY_N: 1
  DEBUG_RGB_ZOOM_SIZE: 96
  DEBUG_RGB_CONTACT_COLS: 6
  DEBUG_RGB_GIF: "leds.gif"
  DEBUG_RGB_GIF_DURATION: 0.12


# === PHOTOTAXIS ENVIRONMENT === #
PHOTOTAXIS_ANALYSIS: True   # If True, use dark/light split processing and Hough circles for phototaxis experiments.
PHOTOTAXIS_FAST: True   # If True, use cached masks/background and ROI-based Hough after the first successful frame.
PHOTOTAXIS_ROI_HALF_SIZE: 70   # Half-size of square ROI around each previous robot center.
PHOTOTAXIS_FULL_DETECT_EVERY: 0   # If > 0, force one full-frame phototaxis detection every N frames.
PHOTOTAXIS_LIGHT_CC_USE_ROIS: True
PHOTOTAXIS_LIGHT_CC_ROI_HALF_SIZE: 50

DIVIDING_LINE:
  X1: 0
  Y1: 1405
  X2: 2973
  Y2: 1560
  DARK_REF_X: 1400
  DARK_REF_Y: 2200
  LIGHT_SIDE: positive
  COORDS: processed

PHOTOTAXIS_THRESHOLDS:
  DARK_THRESHOLD: 40 #41
  LIGHT_THRESHOLD: 20 #30

LIGHT_CONNECTED_COMPONENTS:
  ENABLED: true
  MIN_AREA: 45
  CONNECTIVITY: 8

HOUGH_CIRCLES:
  ENABLED: true
  DP: 1.0
  MIN_DIST: 70.0
  PARAM1: 10.0
  PARAM2: 14.0
  MIN_RADIUS: 40
  MAX_RADIUS: 60
  FALLBACK_PARAM2: 12.0
  FALLBACK_MIN_DIST: 65.0
  FALLBACK_MIN_RADIUS: 38
  FALLBACK_MAX_RADIUS: 62

# === PLOTTING PARAMETERS ===
PLOTTING:
  CENTROIDS_SIZE: 5           # Radius (in pixels) for centroid markers.
  ARROW_LENGTH_FRAME: 30      # Arrow length (in pixels) for per-robot direction on frames.
  TIP_LENGTH: 0.2             # Arrow tip length fraction for OpenCV arrows.
  ARROW_LENGTH_VIS: 100       # Arrow length (in pixels) for arena visualization.
  ARENA_RADIUS: 50            # Radius (in pixels) of red circles drawn at each robot position in arena viz.
  ARENA_XLIM: [0, 2992]       # X-axis limits (pixels) for arena plots.
  ARENA_YLIM: [0, 2976]       # Y-axis limits (pixels) for arena plots.
  HEAD_WIDTH: 30              # Arrow head width for arena arrows (matplotlib).
  HEAD_LENGTH: 30             # Arrow head length for arena arrows (matplotlib).
  TRAJECTORY_DPI: 300         # DPI for saving trajectory figures.
