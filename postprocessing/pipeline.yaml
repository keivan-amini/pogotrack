# Configuration for the complete postprocessing workflow.
# Paths are relative to the repository root unless stated otherwise.

python: .venv/bin/python

paths:
  data: data
  results: results
  tracking_config: config/default.yaml

batch:
  enabled: true
  max_workers: 4

experiments:
  - id: alpha10-4_T100_v2
    date: 18-09-26
    video: alpha10-4_T100_v2.mp4
    n_robots: 64

    # The defaults are id.feather, bkg.bmp, and id_<video>.mp4.
    # Set these explicitly only when an experiment uses different names.
    probe_file: alpha10-4_T100_v2.feather

    outputs:
      normal: "{id}.csv"
      rgb_id: "RGB_ID.csv"
      merged: "merged_{id}.csv"
      slides: "{id}"

    merge:
      # `auto` detects the first sustained swarm movement and the RGB LED onset.
      # Integers can be used as manual overrides for either value.
      seconds_difference: auto
      start_rgb_frame: auto
      auto:
        analysis_seconds: 10.0
        baseline_seconds: 1.5
        displacement_window_seconds: 0.25
        threshold_k: 6.0
        minimum_displacement: 0.35
        min_valid_robot_fraction: 0.75
        min_consecutive_windows: 3

    slides:
      enabled: true
      controller: tanh
      options:
        # These values are passed to experiment_slides_generator.py.
        # Omit an option to use that script's default.
        light_threshold: 73.5
        light_region: below
        comm_time: 300.0
        t_init_shot: 300.0
        t_mid_shot: 900.0
        t_final_shot: 1499.0

        # Optional controller-specific overrides:
        # alpha: 1.0
        # delta: 7.5
        # tau_r_max_plot: 100.0

